# Dựng bộ cài Windows trên máy ảo GitHub (windows-latest): chạy kiểm thử trên Windows thật, đóng gói PyInstaller,
# kiểm tra bản đóng gói mở được CSDL mã hóa, dựng bộ cài Inno Setup. Tải bộ cài ở mục Artifacts của lần chạy.
name: Dong goi Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["qlkt/**", "dong-goi/**", "mau/**", "tests/**", "requirements*.txt", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.11.1

      - name: Kiem thu (Windows, co DPAPI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Dong goi PyInstaller
        run: pyinstaller --noconfirm --clean dong-goi/qlkt.spec

      - name: Kiem tra ban dong goi
        shell: pwsh
        run: |
          $kq = Join-Path $env:RUNNER_TEMP "kiem-tra.txt"
          $p = Start-Process -FilePath "dist\QLKT\QLKT.exe" -ArgumentList "--kiem-tra", "`"$kq`"" -Wait -PassThru
          Get-Content $kq
          if ($p.ExitCode -ne 0) { throw "Ban dong goi loi (ma $($p.ExitCode))" }

      - name: Dung bo cai Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.4.0-thu.$env:GITHUB_RUN_NUMBER" }
          & $iscc "/DPhienBan=$ver" dong-goi\qlkt.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC loi" }

      - uses: actions/upload-artifact@v4
        with:
          name: bo-cai-QLKT-ChiengHac
          path: dist/QLKT-ChiengHac-CaiDat-*.exe
          retention-days: 30
